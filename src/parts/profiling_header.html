<!-- 処方・病態鑑別チャート タブペイン -->
<div id="tab-profiling" class="tab-pane">
  <div class="card" style="margin-bottom:20px; background:linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%); border-left:4px solid #0284c7;">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div>
        <h2 style="font-size:1.35rem; color:var(--primary); font-weight:800; margin-bottom:4px;">🕵️‍♂️ 処方・病態鑑別チャート（カメレオン薬剤＆15疾患プロファイリング）</h2>
        <p style="font-size:0.88rem; color:#64748b; margin:0;">
          「この薬が出ている本当の理由は何か？」処方箋の行間から患者の隠れた病態・重症度を瞬時に見抜く実践鑑別ツールです。
        </p>
      </div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <input type="text" id="profSearchInput" class="search-input" placeholder="🔍 薬名・病態で絞り込み (例: フォシーガ, 寝る前)" onkeyup="filterProfilingContent()" style="padding:8px 14px; border:1px solid #cbd5e1; border-radius:6px; font-size:0.88rem; width:250px;">
        <button class="tab-btn active" onclick="switchProfilingView('all', this)" style="padding:7px 12px; border-radius:6px; border:1px solid #cbd5e1; background:var(--primary); color:white; font-size:0.85rem; cursor:pointer; font-weight:700;">すべて表示</button>
        <button class="tab-btn" onclick="switchProfilingView('chameleon-sec', this)" style="padding:7px 12px; border-radius:6px; border:1px solid #cbd5e1; background:#f1f5f9; color:#334155; font-size:0.85rem; cursor:pointer; font-weight:700;">🦎 カメレオン薬</button>
        <button class="tab-btn" onclick="switchProfilingView('disease-sec', this)" style="padding:7px 12px; border-radius:6px; border:1px solid #cbd5e1; background:#f1f5f9; color:#334155; font-size:0.85rem; cursor:pointer; font-weight:700;">📊 15疾患別チャート</button>
      </div>
    </div>
  </div>
